services:
  - type: web
    name: client-hunter
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: client-hunter-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_BROWSER_KEY
        sync: false

databases:
  - name: client-hunter-db
    databaseName: client_hunter
    plan: free
